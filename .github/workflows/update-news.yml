name: 뉴스 자동 업데이트

on:
  schedule:
    - cron: "0 22 * * *"   # 매일 한국시간 오전 7시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 뉴스 수집
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python scripts/fetch_news.py

      - name: 바뀐 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898332+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || (git commit -m "뉴스 자동 업데이트 $(TZ=Asia/Seoul date +%F)" && git push)
